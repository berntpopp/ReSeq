name: CI

on:
  push:
    branches: [master, devel]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
            packages: gcc-13 g++-13
          - compiler: clang
            cc: clang-17
            cxx: clang++-17
            packages: clang-17
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }} \
            libboost-all-dev libbz2-dev zlib1g-dev

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: build/bin/reseq test

  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check C++ formatting
        run: |
          git ls-files 'reseq/*.cpp' 'reseq/*.h' 'reseq/*.hpp' \
            | xargs clang-format --dry-run --Werror

      - name: Check Python formatting
        run: |
          pip install ruff
          ruff check python/*.py
          ruff format --check python/*.py

  version-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION file
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          if [ "$TAG" != "$FILE_VERSION" ]; then
            echo "ERROR: Tag v$TAG does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "OK: Tag v$TAG matches VERSION file"
